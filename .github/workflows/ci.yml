name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}, Drizzle ${{ matrix.drizzle }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - node: 20
            drizzle: 0.38.0
          - node: 22
            drizzle: 0.45.2
          - node: 24
            drizzle: 0.45.2
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test:package
        env:
          DRIZZLE_VERSION: ${{ matrix.drizzle }}
